name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # The Apps Script web app that keeps copies of checked ads and bug reports (apps-script/).
          VITE_RECORD_URL: https://script.google.com/macros/s/AKfycbxyCjYtGuQAAr8Ca2yiPwXjU_1E2gyk198nuYMKmb0NOs8CNxizUHMuAHjW96GkONTI/exec
          VITE_COMMIT: ${{ github.sha }}
      # Browser tests run against the built site, so what deploys is what was tested.
      - run: npx playwright install --with-deps chromium webkit firefox
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
