<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <!-- The preview frames share this page's origin, so the ad's code can reach into this page and make
         requests from it. This policy blocks those as the frames' own (public/sw.js) blocks the ad's. -->
    <!-- The frames that lay fixes out (srcdoc) inherit this policy: base-uri lets their <base href> point at the ad's files, and stylesheets and fonts may come from https: as in the previews. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https:; img-src 'self' data:; font-src 'self' data: https:; connect-src 'self'; media-src 'self'; frame-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Check a Google Web Designer HTML5 ad against the GWD QA checklist, fix the safe items, and download the fixed zip. Runs entirely in your browser.">
    <title>GWD Ad QA</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23146c43'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11.5' stroke='white' stroke-width='3.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  </head>
  <body>
    <div id="app"></div>
    <noscript>This tool runs in your browser and needs JavaScript.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
